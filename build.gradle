plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "1.4.2"  // 1.4.2: PERMISSION CLARITY hotfix — grant_permissions gains a package= mode that pm-grants runtime permissions to an INSTALLED app with per-permission dumpsys verification and an honest existence-gate refusal for phantom packages (TikTok case); identity HARD RULES: resolve package ids from the system never from memory, grep exit=1 = valid not-installed verdict, am start Error type 3 = failure despite exit=0, launch apps with monkey instead of invented activity names, never imply a reported-not-installed app became usable
def isBeta = project.hasProperty("beta")
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}${if (isBeta) "-beta" else ""}"
}
