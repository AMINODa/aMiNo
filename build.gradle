plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.13113456" // same NDK major 29 the vendored suite builds with — one NDK install fits the sandbox
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "2.0.0-alpha"  // 2.0.0-alpha (SUITE release): Rinigan v6.3 + LSPatch v1.2 vendored under suite/ and shipped inside this APK (assets/suite/ + aMiNo Suite screen installs them). Rinigan re-skinned with the aMiNo palette (com.rinigan.app identity + cert untouched), Patcher re-seeded aMiNo red + aMiNo dark stage (org.lsposed.lspatch identity untouched). Agent/Sharingan internals of 1.6.0-alpha (r1421) untouched. 1.6.0-alpha: capability REPAIR — r1421: duplicate 'skill_save' tool spec removed, REAL timeout watchdog in shell_command, crash-safe atomic skill writes, 500ms post-act settle, per-task cost log. Main stays 1.4.2 until merge
def isBeta = project.hasProperty("beta")
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}${if (isBeta) "-beta" else ""}"
}
