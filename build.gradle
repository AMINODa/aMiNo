plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37 // v2.x — the vendored manager UI stack pins material3 1.5.0-alpha2x whose minCompileSdk is 37; targetSdk stays 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.14206865" // same NDK major 29 the vendored suite builds with — one NDK install fits the sandbox
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
    // aMiNo v2.x — the vendored LSPatch manager's androidx stack resolved to its NEWEST pins
    // (material3 1.5.0-alpha26 / compose 1.12 / lifecycle 2.11 / core 1.19), whose AAR metadata
    // demands Android Gradle plugin 9.1+. aMiNo builds on AGP 8.11.1, so every flagged artifact
    // is pinned back to the newest release whose metadata still allows AGP 8.x (all verified by
    // reading each AAR's aar-metadata.properties: material3 1.5.0-alpha18 == 8.6.0, alpha19+ ==
    // 9.1.0; compose 1.11.4 == 8.6.0; nav3-viewmodel 2.11.0-alpha03 == 8.9.1; M2 material
    // 1.11.0 == 8.6.0). The manager UI sources compile and run against these — the upstream
    // manager itself pinned material3 1.5.0-alpha2x and compose BOM 2026.06.01 (ui 1.11.4).
    configurations.configureEach { conf ->
        conf.resolutionStrategy {
            force(
                "androidx.compose.material3:material3:1.5.0-alpha18",
                "androidx.compose.material3:material3-android:1.5.0-alpha18",
                "androidx.compose.material3:material3-adaptive-navigation-suite:1.5.0-alpha18",
                "androidx.compose.material3:material3-adaptive-navigation-suite-android:1.5.0-alpha18",
                "androidx.compose.material:material:1.11.0",
                "androidx.compose.material:material-android:1.11.0",
                "androidx.core:core:1.16.0",
                "androidx.core:core-ktx:1.16.0",
                "androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0-alpha03",
                "androidx.lifecycle:lifecycle-viewmodel-compose-android:2.11.0-alpha03",
                "androidx.lifecycle:lifecycle-runtime-compose:2.11.0-alpha03",
                "androidx.lifecycle:lifecycle-runtime-compose-android:2.11.0-alpha03",
                "androidx.lifecycle:lifecycle-viewmodel-navigation3:2.11.0-alpha03",
                "androidx.lifecycle:lifecycle-viewmodel-navigation3-android:2.11.0-alpha03"
            )
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "2.0.0-alpha"  // v2 — LSPatch v1.2 engine + Rinigan v6.3 module embedded as side-menu options  // 1.6.0-alpha (branch feature/sharingan-live): capability REPAIR release — r1421: duplicate 'skill_save' tool spec removed (duplicate function name went to EVERY provider every round; strict gateways 400'd), REAL timeout watchdog in shell_command (dead timeoutMs — streaming commands like logcat locked the agent busy forever), crash-safe atomic skill writes (tmp+fsync+rename), 500ms post-act settle against the screen-transition race, per-task cost log (rounds/toolCalls/screenReads/ms). 1.5.0-alpha base: Sharingan Live panel, memory core, Duration Guardian, single-flight admission (r1414-r1420). Main stays 1.4.2 until merge
def isBeta = project.hasProperty("beta")
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}${if (isBeta) "-beta" else ""}"
}
