plugins {
    id "idea"
    id "com.android.library" apply false
    id "org.jetbrains.kotlin.android" apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 36
            buildToolsVersion = "36.0.0"
            ndkVersion = "29.0.14206865"
            defaultConfig {
                minSdk = 24
                targetSdk = 36
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "1.5.0-alpha"  // 1.5.0-alpha (branch feature/sharingan-live): Sharingan Live — accessibility button → floating panel (TYPE_ACCESSIBILITY_OVERLAY), Record ⏺ 1fps screencap with on-device md5 change skipping + uiautomator text, Execute ⚡ stages [SHARINGAN CONTEXT] (real frames only — TRACE TRUTH) into the next agent message; main stays 1.4.2 until merge
def isBeta = project.hasProperty("beta")
ext {
    versionCode = gitCommitCount
    versionName = "${baseVersionName}${if (isBeta) "-beta" else ""}"
}
