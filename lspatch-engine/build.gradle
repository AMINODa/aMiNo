// aMiNo v2 — lspatch-engine
// FROZEN SNAPSHOT of the LSPatch v1.2 patching engine (JingMatrix fork, tag v1.2, verCode 487),
// embedded as pure-JVM sources so aMiNo can patch target APKs in-process (rootless Xposed).
// Source of truth: https://github.com/JingMatrix/LSPatch (modules :patch :apkzlib :share:java + vector:axml).
// License: LGPL-3.0 — see LICENSE in this directory. Frozen by design: the loader runtime
// (loader.dex / metaloader.dex / liblspatch.so) is consumed as opaque build artifacts, never recompiled here.
// The CLI entry (org.lsposed.patch.LSPatch + jcommander) is intentionally NOT part of this module.
plugins {
    id "java-library"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    // Unified with :manager to keep ONE copy of each in the final APK:
    api "com.android.tools.build:apksig:8.13.2"        // was 8.0.2 upstream — API-stable upgrade
    api "com.google.guava:guava:32.0.1-jre"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    implementation "org.bouncycastle:bcpkix-jdk18on:1.80" // unified with :manager (upstream: jdk15on 1.70)
    implementation "com.google.code.gson:gson:2.13.1"
    implementation "commons-io:commons-io:2.20.0"
    compileOnlyApi "com.google.auto.value:auto-value-annotations:1.10.1"
    annotationProcessor "com.google.auto.value:auto-value:1.10.1"
}
